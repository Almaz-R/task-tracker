name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd services/backend
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker:${{ env.IMAGE_TAG }}

  scan-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/task-tracker:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-consumer:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Consumer
        uses: docker/build-push-action@v4
        with:
          context: ./services/consumer
          file: ./services/consumer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/consumer:${{ env.IMAGE_TAG }}

  build-frontend:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-frontend:${{ env.IMAGE_TAG }}