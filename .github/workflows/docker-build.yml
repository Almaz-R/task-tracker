name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Task Tracker
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile # Твой корневой Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker:latest

  build-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Consumer
        uses: docker/build-push-action@v4
        with:
          context: ./services/consumer # Путь к папке консьюмера
          file: ./services/consumer/Dockerfile # Путь к Dockerfile консьюмера
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/consumer:latest