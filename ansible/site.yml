---
- name: Configure task-tracker server
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system utilities
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - ufw
          - vim
          - net-tools
          - ca-certificates
          - gnupg
          - lsb-release
          - unzip
        state: present

    - name: Allow SSH in UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow HTTP ingress NodePort
      community.general.ufw:
        rule: allow
        port: "30088"
        proto: tcp

    - name: Allow HTTPS ingress NodePort
      community.general.ufw:
        rule: allow
        port: "30443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: allow

    - name: Check k3s service status
      ansible.builtin.systemd:
        name: k3s
      register: k3s_status
      failed_when: false
      changed_when: false

    - name: Show k3s status
      ansible.builtin.debug:
        msg: "k3s service state is {{ k3s_status.status.ActiveState | default('unknown') }}"

    - name: Allow OpenSearch Dashboards test NodePort
      community.general.ufw:
        rule: allow
        port: "30601"
        proto: tcp

    - name: Allow OpenSearch Dashboards prod NodePort
      community.general.ufw:
        rule: allow
        port: "30602"
        proto: tcp