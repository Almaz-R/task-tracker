apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.15.0 # версия чарта
    helm:
      values: |
        expose:
          type: nodePort
          tls:
            enabled: false
        externalURL: http://111.88.157.232:30002
        persistence:
          enabled: true
          resourcePolicy: keep
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true