apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: consumer-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Almaz-R/task-tracker.git
    targetRevision: main
    path: services/consumer # Указываем путь к папке с кодом консьюмера
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true