apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: task-tracker-test
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /test/grafana/
        pathType: Prefix
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80
      - path: /test/opensearch/
        pathType: Prefix
        backend:
          service:
            name: opensearch-dashboards-service
            port:
              number: 80