apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: task-tracker-test
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /test/grafana(/|$)(.*) # Захватываем всё после /test/grafana
        pathType: Prefix
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80