apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-tracker-test
resources:
- ../../../base/monitoring
- ingress.yaml
patches:
- target:
    kind: ConfigMap
    name: prometheus-grafana
  patch: |-
    - op: replace
      path: /data/grafana.ini
      value: |
        [server]
        http_port = 3000
        root_url = %(protocol)s://%(domain)s:%(http_port)s/test/grafana/
        serve_from_sub_path = true
- target:
    kind: Deployment
    name: opensearch-dashboards
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "/test/opensearch"