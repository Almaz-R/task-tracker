apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-ingress
  namespace: task-tracker-test
  annotations:
    # Важно: отключаем HTTPS редирект, если у тебя нет сертификатов
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /test/kafka
        pathType: Prefix
        backend:
          service:
            name: kafka-ui-service # Убедись, что имя сервиса именно такое
            port:
              number: 8080