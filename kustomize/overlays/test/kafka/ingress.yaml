apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-ingress
  namespace: task-tracker-test
  annotations:
    # Удаляем rewrite-target, он здесь больше не нужен
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /kafka
        pathType: Prefix
        backend:
          service:
            name: kafka-ui-service
            port:
              number: 80