apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-tracker-test
resources:
- ../../../base/kafka
- ingress.yaml
patches:
- target:
    kind: Deployment
    name: kafka-ui
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SERVER_SERVLET_CONTEXT_PATH
        value: "/test/kafka"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: PROXY_PATH
        value: "/test/kafka"