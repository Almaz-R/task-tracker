apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    # Указываем, что нужно использовать регулярные выражения
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Переписываем запрос так, чтобы бэкенд получал чистый путь без префикса
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - host: backend-test.task-tracker.local
    http:
      paths:
      - path: /api/(.*)
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000