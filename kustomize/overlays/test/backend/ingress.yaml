apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: task-tracker-test
  annotations:
    # 1. Указываем nginx отрезать префикс /test/backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 2. Ловим всё, что начинается с /test/backend
      # (.*) захватывает всё, что идет ПОСЛЕ /test/backend, в переменную $2
      - path: /test/backend(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80