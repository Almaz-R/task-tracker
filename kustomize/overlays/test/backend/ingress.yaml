apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: task-tracker-test
  annotations:
    # 1. Используем regex, чтобы отрезать префикс
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 2. Паттерн: ловим /test/backend и всё, что идет после него
      - path: /test/backend(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80