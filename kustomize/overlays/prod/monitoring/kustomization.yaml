apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-tracker-prod
resources:
- ../../../base/monitoring
- ingress.yaml
patches:
- target:
    kind: Deployment
    name: prometheus-grafana
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "%(protocol)s://%(domain)s:%(http_port)s/prod/grafana/"