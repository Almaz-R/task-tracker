apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-dashboards
  template:
    metadata:
      labels:
        app: os-dashboards
    spec:
      containers:
      - name: os-dashboards
        image: opensearchproject/opensearch-dashboards:2.11.0
        env:
        - name: OPENSEARCH_HOSTS
          value: '["https://opensearch-service:9200"]'
        - name: SERVER_BASEPATH
          value: "/opensearch"
        - name: SERVER_REWRITE_BASEPATH
          value: "true"
        ports:
        - containerPort: 5601
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards-service
spec:
  selector:
    app: os-dashboards
  ports:
    - port: 80
      targetPort: 5601