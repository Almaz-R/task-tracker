apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-grafana-config-dashboards
data:
  # Если дашбордов пока нет, оставляем данные пустыми или добавляем заглушку
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: true
      editable: true
      options:
        path: /var/lib/grafana/dashboards