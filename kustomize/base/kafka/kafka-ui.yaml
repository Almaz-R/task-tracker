apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: task-tracker-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: local-k3s
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka-service:9092
        # ВАЖНО: Указываем контекстный путь
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: "/kafka"
        ports:
        - containerPort: 8080