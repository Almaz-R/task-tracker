apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        fluentbit.io/parser: json
    spec:
      serviceAccountName: fluent-bit # Добавили связку
      containers:
      - name: backend
        image: almaz8412/task-tracker:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_PASSWORD
          value: "password"
        envFrom:
        - configMapRef:
            name: app-config