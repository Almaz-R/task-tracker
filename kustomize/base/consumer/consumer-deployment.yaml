apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
      - name: consumer
        image: almaz8412/consumer:latest
        imagePullPolicy: Always
        env:
        # Адрес Кафки: используй имя сервиса кафки, который есть в кластере
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service:9092"

        # Настройки базы данных
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "postgres"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "password" # Замени на свой реальный пароль

        # Название топика, который нужно читать
        - name: KAFKA_TOPIC
          value: "tasks"