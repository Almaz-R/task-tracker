apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.11.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          service:
            type: NodePort
            externalTrafficPolicy: Local
            nodePorts:
              http: 30080
              https: 30443
          admissionWebhooks:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    ignoreDifferences:
      - group: ""
        kind: Service
        name: ingress-nginx-controller
        jsonPointers:
          - /status
          - /spec/clusterIP
          - /spec/clusterIPs
          - /spec/type
      - group: apps
        kind: Deployment
        name: ingress-nginx-controller
        jsonPointers:
          - /status