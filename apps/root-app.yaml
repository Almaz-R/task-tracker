apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: all-services
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: backend
        path: services/backend
      - name: kafka
        path: services/kafka
      - name: database
        path: services/database
      - name: consumer
        path: services/consumer
      - name: monitoring
        path: services/monitoring
  template:
    metadata:
      name: '{{name}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/Almaz-R/task-tracker.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      # ЭТОТ БЛОК ИСПРАВИТ ОРАНЖЕВЫЙ СТАТУС:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /status
            - /spec/template/metadata/labels
        - group: ""
          kind: Service
          jsonPointers:
            - /status