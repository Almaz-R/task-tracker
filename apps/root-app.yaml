apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: all-services
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - name: backend
          - name: kafka
          - name: database
          - name: consumer
          - name: monitoring
      - list:
          elements:
          - env: test
          - env: prod
  template:
    metadata:
      name: '{{env}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Almaz-R/task-tracker.git
        targetRevision: main
        path: kustomize/overlays/{{env}}/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'task-tracker-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /status
            - /spec/template/metadata/labels
            - /metadata/resourceVersion
            - /metadata/uid
            - /metadata/generation
            - /metadata/annotations
            - /spec/template/spec/containers/0/terminationMessagePath
            - /spec/template/spec/containers/0/terminationMessagePolicy
            - /spec/template/spec/containers/0/imagePullPolicy
            - /spec/template/spec/dnsPolicy
            - /spec/template/spec/restartPolicy
            - /spec/template/spec/schedulerName
            - /spec/template/spec/securityContext
            - /spec/template/spec/terminationGracePeriodSeconds
        - group: ""
          kind: Service
          jsonPointers:
            - /status
            - /metadata/resourceVersion
            - /metadata/uid
            - /metadata/generation
            - /metadata/annotations
            - /spec/clusterIP
            - /spec/clusterIPs
            - /spec/internalTrafficPolicy
            - /spec/externalTrafficPolicy
            - /spec/ports
            - /metadata/labels