apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: task-tracker-apps
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      # Сервисы
      - name: backend
        env: test
      - name: backend
        env: prod
      - name: kafka
        env: test
      - name: kafka
        env: prod
      - name: database
        env: test
      - name: database
        env: prod
      - name: consumer
        env: test
      - name: consumer
        env: prod
      - name: monitoring
        env: test
      - name: monitoring
        env: prod
      # Ингресс
      - name: ingress-nginx
        env: system
  template:
    metadata:
      name: '{{#if (eq env "system")}}{{name}}{{else}}{{env}}-{{name}}{{/if}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Almaz-R/task-tracker.git
        targetRevision: main
        path: '{{#if (eq env "system")}}kustomize/ingress-nginx{{else}}kustomize/overlays/{{env}}/{{name}}{{/if}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{#if (eq env "system")}}ingress-nginx{{else}}task-tracker-{{env}}{{/if}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /status
            - /spec/template/metadata/labels
            - /metadata/resourceVersion
            - /metadata/uid
            - /metadata/generation
            - /metadata/annotations
            - /spec/template/spec/containers/0/terminationMessagePath
            - /spec/template/spec/containers/0/terminationMessagePolicy
            - /spec/template/spec/containers/0/imagePullPolicy
            - /spec/template/spec/dnsPolicy
            - /spec/template/spec/restartPolicy
            - /spec/template/spec/schedulerName
            - /spec/template/spec/securityContext
            - /spec/template/spec/terminationGracePeriodSeconds
        - group: ""
          kind: Service
          jsonPointers:
            - /status
            - /metadata/resourceVersion
            - /metadata/uid
            - /metadata/generation
            - /metadata/annotations
            - /spec/clusterIP
            - /spec/clusterIPs
            - /spec/internalTrafficPolicy
            - /spec/externalTrafficPolicy
            - /spec/ports
            - /metadata/labels