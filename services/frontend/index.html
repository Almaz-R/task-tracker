<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Task Tracker</title>
</head>
<body>
  <h1>Task Tracker</h1>
  <p><b>Environment:</b> TEST / develop</p>

  <input id="taskName" placeholder="Введите задачу" />
  <button onclick="createTask()">Создать задачу</button>
  <button onclick="loadTasks()">Обновить список</button>

  <h2>Результат</h2>
  <pre id="result"></pre>

  <h2>Список задач</h2>
  <ul id="tasks"></ul>

  <script>
    async function createTask() {
      const taskName = document.getElementById("taskName").value;
      const response = await fetch("/test/backend/tasks?task_name=" + encodeURIComponent(taskName), {
        method: "POST"
      });
      const data = await response.json();
      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      await loadTasks();
    }

    async function loadTasks() {
      const response = await fetch("/test/backend/tasks");
      const data = await response.json();
      const list = document.getElementById("tasks");
      list.innerHTML = "";
      data.forEach(task => {
        const item = document.createElement("li");
        item.textContent = `#${task.id}: ${task.task_name}`;
        list.appendChild(item);
      });
    }

    loadTasks();
  </script>
</body>
</html>
